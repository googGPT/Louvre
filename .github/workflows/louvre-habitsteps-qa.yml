name: QA Louvre App XX — HabitSteps
on:
  pull_request:
    paths:
      - 'apps/habitsteps/**'
      - '.github/workflows/louvre-habitsteps-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static security and schemas
        run: |
          node --check apps/habitsteps/core.js
          node --check apps/habitsteps/app.js
          node --check apps/habitsteps/sw.js
          node -e "JSON.parse(require('fs').readFileSync('apps/habitsteps/manifest.webmanifest','utf8'))"
      - name: Run independent business tests
        run: node --test apps/habitsteps/tests/core.test.cjs
      - name: Chromium browser integration tests
        run: |
          python -m pip install --disable-pip-version-check 'playwright>=1.45,<2'
          python apps/habitsteps/tests/browser.test.py
