name: Wave 2 QA — TextDiff
on:
  pull_request:
    paths:
      - 'apps/textdiff/**'
      - '.github/workflows/louvre-wave2-textdiff-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify syntax, PWA manifest and LCS domain cases
        run: |
          set -euo pipefail
          node --check apps/textdiff/core.js
          node --check apps/textdiff/app.js
          node --check apps/textdiff/sw.js
          node -e "JSON.parse(require('fs').readFileSync('apps/textdiff/manifest.webmanifest','utf8'))"
          cmp apps/textdiff/index.html apps/textdiff/index.htm
          node --test apps/textdiff/tests/core.test.cjs
      - name: Install free Chromium Playwright client
        run: python -m pip install --disable-pip-version-check 'playwright>=1.45,<2'
      - name: Test LCS UI, saved report, security, mobile and offline
        run: python apps/textdiff/tests/browser.test.py
