name: Wave 2 QA — CitationCraft
on:
  pull_request:
    paths:
      - 'apps/citationcraft/**'
      - '.github/workflows/louvre-wave2-citationcraft-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate JavaScript, mirrored HTML, PWA and bibliographic parsers
        run: |
          set -euo pipefail
          node --check apps/citationcraft/core.js
          node --check apps/citationcraft/app.js
          node --check apps/citationcraft/sw.js
          node -e "JSON.parse(require('fs').readFileSync('apps/citationcraft/manifest.webmanifest','utf8'))"
          cmp apps/citationcraft/index.html apps/citationcraft/index.htm
          node --test apps/citationcraft/tests/core.test.cjs
      - name: Install Playwright client (free)
        run: python -m pip install --disable-pip-version-check 'playwright>=1.45,<2'
      - name: Chromium transactions, import/export and mobile offline
        run: python apps/citationcraft/tests/browser.test.py
