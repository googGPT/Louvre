name: Wave 2 QA — CSVClinic
on:
  pull_request:
    paths:
      - 'apps/csvclinic/**'
      - '.github/workflows/louvre-wave2-csvclinic-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test domain engine and script syntax
        run: |
          node --check apps/csvclinic/core.js
          node --check apps/csvclinic/app.js
          node --check apps/csvclinic/sw.js
          node -e "JSON.parse(require('fs').readFileSync('apps/csvclinic/manifest.webmanifest','utf8'))"
          cmp apps/csvclinic/index.html apps/csvclinic/index.htm
          node --test apps/csvclinic/tests/core.test.cjs
      - name: Install free Playwright test client
        run: python -m pip install --disable-pip-version-check 'playwright>=1.45,<2'
      - name: Chrome end-to-end and mobile offline test
        run: python apps/csvclinic/tests/browser.test.py
