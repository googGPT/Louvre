name: Wave 2 QA — ColorContrast
on:
  pull_request:
    paths:
      - 'apps/colorcontrast/**'
      - '.github/workflows/louvre-wave2-colorcontrast-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node syntax and business cases
        run: |
          node --check apps/colorcontrast/core.js
          node --check apps/colorcontrast/app.js
          node --check apps/colorcontrast/sw.js
          node -e "JSON.parse(require('fs').readFileSync('apps/colorcontrast/manifest.webmanifest','utf8'))"
          node --test apps/colorcontrast/tests/core.test.cjs
      - name: Browser test dependencies
        run: python -m pip install --disable-pip-version-check 'playwright>=1.45,<2'
      - name: Chromium integration and mobile PWA
        run: python apps/colorcontrast/tests/browser.test.py
