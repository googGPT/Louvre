name: Deploy Louvre web apps to GitHub Pages

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'index.html'
      - 'assets/**'
      - 'scripts/build_home.py'
      - '.github/workflows/deploy-moneyuntil-pages.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'index.html'
      - 'assets/**'
      - 'scripts/build_home.py'
      - '.github/workflows/deploy-moneyuntil-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moneyuntil-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify MoneyUntil without paid dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test budget math, backups and what-if calculator
        run: |
          node --version
          node --test apps/moneyuntil/tests/moneyuntil.test.mjs

      - name: Test ReceiptRescue business rules
        run: |
          node --check apps/receiptrescue/core.js
          node --check apps/receiptrescue/app.js
          node --check apps/receiptrescue/sw.js
          node -e "JSON.parse(require('fs').readFileSync('apps/receiptrescue/manifest.webmanifest','utf8'))"
          node --test apps/receiptrescue/tests/receiptrescue.test.mjs

      - name: Test SnapAction date parsing and storage validation
        run: |
          node --check apps/snapaction/core.js
          node --check apps/snapaction/app.js
          node --check apps/snapaction/sw.js
          node -e "JSON.parse(require('fs').readFileSync('apps/snapaction/manifest.webmanifest','utf8'))"
          TZ=Europe/Paris node --test apps/snapaction/tests/core.test.cjs

      - name: Test FridgeFirst validation, expiry dates and recipe ranking
        run: |
          node --check apps/fridgefirst/core.js
          node --check apps/fridgefirst/app.js
          node --check apps/fridgefirst/sw.js
          node -e "JSON.parse(require('fs').readFileSync('apps/fridgefirst/manifest.webmanifest','utf8'))"
          TZ=Europe/Paris node --test apps/fridgefirst/tests/core.test.cjs

      - name: Test HomePulse maintenance dates and validated backups
        run: |
          node --check apps/homepulse/core.js
          node --check apps/homepulse/app.js
          node --check apps/homepulse/sw.js
          node -e "JSON.parse(require('fs').readFileSync('apps/homepulse/manifest.webmanifest','utf8'))"
          TZ=Europe/Paris node --test apps/homepulse/tests/core.test.cjs

      - name: Verify ParkWise parking math, schema and PWA scripts
        run: |
          node --check apps/parkwise/core.js
          node --check apps/parkwise/app.js
          node --check apps/parkwise/sw.js
          node -e "JSON.parse(require('fs').readFileSync('apps/parkwise/manifest.webmanifest','utf8'))"
          TZ=Europe/Paris node --test apps/parkwise/tests/core.test.cjs

      - name: Test FindMyStuff search, validation and backups
        run: |
          node --check apps/findmystuff/core.js
          node --check apps/findmystuff/app.js
          node --check apps/findmystuff/sw.js
          node -e "JSON.parse(require('fs').readFileSync('apps/findmystuff/manifest.webmanifest','utf8'))"
          TZ=Europe/Paris node --test apps/findmystuff/tests/core.test.cjs

      - name: Verify all present Louvre app entrypoints and published-site verifier
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_verify_public_app.py' -v
          verified=0
          for app in apps/*/; do
            if [ ! -f "${app}index.html" ] || [ ! -f "${app}core.js" ]; then continue; fi
            slug="${app#apps/}"
            slug="${slug%/}"
            python scripts/verify_public_app.py --slug "$slug" --html "${app}index.html" --core "${app}core.js"
            verified=$((verified + 1))
          done
          echo "LOUVRE_LOCAL_APP_VERIFY_PASS $verified app(s)"

      - name: Test any newly merged Louvre Wave 2 business logic
        run: |
          set -euo pipefail
          for slug in gradepilot shiftledger colorcontrast imageshrink qrforge csvclinic textdiff citationcraft invoicecanvas roomsketch keyboardcoach laundrydecoder pollbox fileintegrity seatarrange careermatch loansim markdowndesk logiclab timelinebuilder; do
            if [ ! -f "apps/$slug/index.html" ]; then continue; fi
            node --check "apps/$slug/core.js"
            node --check "apps/$slug/app.js"
            node --check "apps/$slug/sw.js"
            node --test "apps/$slug/tests/core.test.cjs"
          done

      - name: Install free browser test harness and required QR decoder
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright>=1.45,<2'
          # Only QRForge's independent PNG/SVG decoding checks require these.
          if [ -f apps/qrforge/tests/browser.test.py ]; then
            python -m pip install --disable-pip-version-check 'zxing-cpp>=2.2,<4' 'Pillow>=10,<13'
          fi

      - name: Test MoneyUntil budget UI, JSON backups and mobile browser
        run: python apps/moneyuntil/tests/browser.test.py

      - name: Test receipt storage, backup and mobile layout in Chrome
        run: python apps/receiptrescue/tests/browser.test.py

      - name: Test SnapAction capture, persistence, recovery and offline PWA in Chrome
        run: python apps/snapaction/tests/browser.test.py

      - name: Test FridgeFirst inventory, recipes, backups and offline mobile browser
        run: python apps/fridgefirst/tests/browser.test.py

      - name: Test HomePulse maintenance, photos, costs, backups and offline mobile browser
        run: python apps/homepulse/tests/browser.test.py

      - name: Test ParkWise pricing, GPS, local backups and offline mobile browser
        run: python apps/parkwise/tests/browser.test.py

      - name: Test FindMyStuff photos, loans, local backups and offline mobile browser
        run: python apps/findmystuff/tests/browser.test.py

      - name: Test all present Louvre Factory apps before any publication
        run: |
          set -euo pipefail
          for slug in splitfair focusforge studyrecall trippack pricelens billcalendar habitsteps giftnest readtrail fuelmath decisiondeck eventcount roundplan worldmeet chorewheel mileagebook travelday sizematch goalladder quizcraft; do
            if [ ! -f "apps/$slug/index.html" ]; then continue; fi
            node --check "apps/$slug/core.js"
            node --check "apps/$slug/app.js"
            node --check "apps/$slug/sw.js"
            node --test "apps/$slug/tests/core.test.cjs"
            python "apps/$slug/tests/browser.test.py"
          done

      - name: Test any newly merged Louvre Wave 2 browser experiences
        run: |
          set -euo pipefail
          for slug in gradepilot shiftledger colorcontrast imageshrink qrforge csvclinic textdiff citationcraft invoicecanvas roomsketch keyboardcoach laundrydecoder pollbox fileintegrity seatarrange careermatch loansim markdowndesk logiclab timelinebuilder; do
            if [ ! -f "apps/$slug/index.html" ]; then continue; fi
            python "apps/$slug/tests/browser.test.py"
          done

  deploy:
    if: github.event_name != 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare isolated static website
        run: |
          set -euo pipefail
          mkdir -p _site/apps/moneyuntil
          cp apps/moneyuntil/index.html _site/apps/moneyuntil/index.html
          cp apps/moneyuntil/index.htm _site/apps/moneyuntil/index.htm
          cp apps/moneyuntil/sitemap.xml _site/apps/moneyuntil/sitemap.xml
          # Page d'accueil : catalogue généré depuis apps/catalogue.json
          python scripts/build_home.py --check
          cp index.html _site/index.html
          mkdir -p _site/assets
          cp assets/home.css assets/home.js _site/assets/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/apps/moneyuntil/index.html
          test -s _site/apps/moneyuntil/sitemap.xml
          cmp _site/apps/moneyuntil/index.htm _site/apps/moneyuntil/index.html
          mkdir -p _site/apps/receiptrescue
          cp apps/receiptrescue/index.html apps/receiptrescue/index.htm apps/receiptrescue/core.js apps/receiptrescue/app.js apps/receiptrescue/style.css apps/receiptrescue/sitemap.xml apps/receiptrescue/sw.js apps/receiptrescue/manifest.webmanifest apps/receiptrescue/icon.svg _site/apps/receiptrescue/
          cmp _site/apps/receiptrescue/index.htm _site/apps/receiptrescue/index.html
          test -s _site/apps/receiptrescue/app.js
          test -s _site/apps/receiptrescue/core.js
          mkdir -p _site/apps/snapaction
          cp apps/snapaction/index.html apps/snapaction/index.htm apps/snapaction/core.js apps/snapaction/app.js apps/snapaction/style.css apps/snapaction/sitemap.xml apps/snapaction/sw.js apps/snapaction/manifest.webmanifest apps/snapaction/icon.svg apps/snapaction/README.md _site/apps/snapaction/

      - name: Confirm static SnapAction assets in Pages artifact
        run: |
          test -s _site/apps/snapaction/index.html
          test -s _site/apps/snapaction/app.js
          test -s _site/apps/snapaction/sw.js
          cmp _site/apps/snapaction/index.html _site/apps/snapaction/index.htm

      - name: Prepare FridgeFirst static website alongside existing applications
        run: |
          set -euo pipefail
          mkdir -p _site/apps/fridgefirst
          cp apps/fridgefirst/index.html apps/fridgefirst/index.htm apps/fridgefirst/style.css apps/fridgefirst/core.js apps/fridgefirst/app.js apps/fridgefirst/manifest.webmanifest apps/fridgefirst/icon.svg apps/fridgefirst/sw.js apps/fridgefirst/sitemap.xml _site/apps/fridgefirst/
          cmp _site/apps/fridgefirst/index.html _site/apps/fridgefirst/index.htm
          test -s _site/apps/fridgefirst/core.js
          test -s _site/apps/fridgefirst/app.js
          test -s _site/apps/moneyuntil/index.html
          test -s _site/apps/receiptrescue/index.html
          test -s _site/apps/snapaction/index.html

      - name: Prepare HomePulse without overwriting earlier applications
        run: |
          set -euo pipefail
          mkdir -p _site/apps/homepulse
          cp apps/homepulse/index.html apps/homepulse/index.htm apps/homepulse/core.js apps/homepulse/app.js apps/homepulse/style.css apps/homepulse/sw.js apps/homepulse/manifest.webmanifest apps/homepulse/icon.svg apps/homepulse/sitemap.xml _site/apps/homepulse/
          cmp _site/apps/homepulse/index.html _site/apps/homepulse/index.htm
          test -s _site/apps/homepulse/core.js
          for app in moneyuntil receiptrescue snapaction fridgefirst; do
            test -s "_site/apps/$app/index.html"
          done

      - name: Prepare ParkWise without overwriting earlier applications
        run: |
          set -euo pipefail
          mkdir -p _site/apps/parkwise
          cp apps/parkwise/index.html apps/parkwise/index.htm apps/parkwise/core.js apps/parkwise/app.js apps/parkwise/style.css apps/parkwise/sw.js apps/parkwise/manifest.webmanifest apps/parkwise/icon.svg apps/parkwise/sitemap.xml _site/apps/parkwise/
          cmp _site/apps/parkwise/index.html _site/apps/parkwise/index.htm
          test -s _site/apps/parkwise/core.js
          for app in moneyuntil receiptrescue snapaction fridgefirst homepulse; do
            test -s "_site/apps/$app/index.html"
          done

      - name: Add FindMyStuff and preserve six existing websites
        run: |
          set -euo pipefail
          mkdir -p _site/apps/findmystuff
          cp apps/findmystuff/index.html apps/findmystuff/index.htm apps/findmystuff/core.js apps/findmystuff/app.js apps/findmystuff/style.css apps/findmystuff/sw.js apps/findmystuff/manifest.webmanifest apps/findmystuff/icon.svg apps/findmystuff/sitemap.xml _site/apps/findmystuff/
          cmp _site/apps/findmystuff/index.html _site/apps/findmystuff/index.htm
          test -s _site/apps/findmystuff/core.js
          for app in moneyuntil receiptrescue snapaction fridgefirst homepulse parkwise; do
            test -s "_site/apps/$app/index.html"
          done

      - name: Prepare any merged Louvre Factory applications (without removing legacy apps)
        run: |
          set -euo pipefail
          for slug in splitfair focusforge studyrecall trippack pricelens billcalendar habitsteps giftnest readtrail fuelmath decisiondeck eventcount roundplan worldmeet chorewheel mileagebook travelday sizematch goalladder quizcraft; do
            if [ ! -f "apps/$slug/index.html" ]; then continue; fi
            mkdir -p "_site/apps/$slug"
            for file in index.html index.htm core.js app.js style.css sw.js manifest.webmanifest icon.svg sitemap.xml; do
              test -f "apps/$slug/$file"
              cp "apps/$slug/$file" "_site/apps/$slug/$file"
            done
            cmp "_site/apps/$slug/index.html" "_site/apps/$slug/index.htm"
          done
          for slug in moneyuntil receiptrescue snapaction fridgefirst homepulse parkwise findmystuff; do
            test -s "_site/apps/$slug/index.html"
          done

      - name: Include independently merged Louvre Wave 2 apps in Pages artifact
        run: |
          set -euo pipefail
          for slug in gradepilot shiftledger colorcontrast imageshrink qrforge csvclinic textdiff citationcraft invoicecanvas roomsketch keyboardcoach laundrydecoder pollbox fileintegrity seatarrange careermatch loansim markdowndesk logiclab timelinebuilder; do
            if [ ! -f "apps/$slug/index.html" ]; then continue; fi
            mkdir -p "_site/apps/$slug"
            for file in index.html index.htm core.js app.js style.css sw.js manifest.webmanifest icon.svg sitemap.xml; do
              test -s "apps/$slug/$file"
              cp "apps/$slug/$file" "_site/apps/$slug/$file"
            done
            cmp "_site/apps/$slug/index.html" "_site/apps/$slug/index.htm"
          done
          for slug in moneyuntil receiptrescue snapaction fridgefirst homepulse parkwise findmystuff; do
            test -s "_site/apps/$slug/index.html"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload MoneyUntil site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish MoneyUntil
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public MoneyUntil is accessible
        run: |
          set -euo pipefail
          SITE="https://googgpt.github.io/Louvre/apps/moneyuntil/"
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error --max-time 12 "$SITE" -o /tmp/moneyuntil-live.html \
              && grep -q 'id="daily-amount"' /tmp/moneyuntil-live.html \
              && grep -q '<title>MoneyUntil' /tmp/moneyuntil-live.html; then
              echo "PUBLIC_SMOKE_PASS $SITE"
              exit 0
            fi
            echo "Deployment not yet accessible; check $attempt/24"
            sleep 5
          done
          echo "PUBLIC_SMOKE_FAIL $SITE" >&2
          exit 1

      - name: Verify public ReceiptRescue is accessible
        run: |
          set -euo pipefail
          SITE="https://googgpt.github.io/Louvre/apps/receiptrescue/"
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error --max-time 12 "$SITE" -o /tmp/receiptrescue-live.html \
              && grep -q '<title>ReceiptRescue' /tmp/receiptrescue-live.html \
              && curl --fail --silent --show-error --max-time 12 "https://googgpt.github.io/Louvre/apps/receiptrescue/core.js" -o /tmp/receiptrescue-core.js \
              && grep -q 'validateBackup' /tmp/receiptrescue-core.js \
              && curl --fail --silent --show-error --max-time 12 "https://googgpt.github.io/Louvre/apps/receiptrescue/sw.js" -o /tmp/receiptrescue-sw.js \
              && grep -q 'receiptrescue-shell-' /tmp/receiptrescue-sw.js \
              && curl --fail --silent --show-error --max-time 12 "https://googgpt.github.io/Louvre/apps/receiptrescue/manifest.webmanifest" -o /tmp/receiptrescue-manifest.json; then
              echo "PUBLIC_SMOKE_PASS $SITE"
              exit 0
            fi
            echo "ReceiptRescue not yet accessible; check $attempt/24"
            sleep 5
          done
          echo "PUBLIC_SMOKE_FAIL $SITE" >&2
          exit 1

      - name: Verify public SnapAction is accessible
        run: |
          set -euo pipefail
          SITE="https://googgpt.github.io/Louvre/apps/snapaction/"
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error --max-time 12 "$SITE" -o /tmp/snapaction-live.html \
              && grep -q '<title>SnapAction' /tmp/snapaction-live.html \
              && curl --fail --silent --show-error --max-time 12 "${SITE}core.js" -o /tmp/snapaction-core.js \
              && grep -q 'parseCommand' /tmp/snapaction-core.js \
              && curl --fail --silent --show-error --max-time 12 "${SITE}sw.js" -o /tmp/snapaction-sw.js; then
              echo "PUBLIC_SMOKE_PASS $SITE"
              exit 0
            fi
            echo "SnapAction deployment not ready; attempt $attempt/24"
            sleep 5
          done
          echo "PUBLIC_SMOKE_FAIL $SITE" >&2
          exit 1


      - name: Verify public FridgeFirst and protect the first three sites
        run: |
          set -euo pipefail
          SITE="https://googgpt.github.io/Louvre/apps/fridgefirst/"
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error --max-time 12 "$SITE" -o /tmp/fridgefirst-live.html \
              && grep -q '<title>FridgeFirst' /tmp/fridgefirst-live.html \
              && curl --fail --silent --show-error --max-time 12 "${SITE}core.js" -o /tmp/fridgefirst-core.js \
              && grep -q 'recipeSuggestions' /tmp/fridgefirst-core.js \
              && curl --fail --silent --show-error --max-time 12 "${SITE}sw.js" -o /tmp/fridgefirst-sw.js; then
              echo "PUBLIC_SMOKE_PASS $SITE"
              exit 0
            fi
            echo "FridgeFirst unavailable; check $attempt/24"
            sleep 5
          done
          echo "PUBLIC_SMOKE_FAIL $SITE" >&2
          exit 1

      - name: Verify public HomePulse site
        run: |
          set -euo pipefail
          SITE="https://googgpt.github.io/Louvre/apps/homepulse/"
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error --max-time 12 "$SITE" -o /tmp/homepulse-live.html \
              && grep -q '<title>HomePulse' /tmp/homepulse-live.html \
              && curl --fail --silent --show-error --max-time 12 "${SITE}core.js" -o /tmp/homepulse-core.js \
              && grep -q 'cleanState' /tmp/homepulse-core.js \
              && curl --fail --silent --show-error --max-time 12 "${SITE}sw.js" -o /tmp/homepulse-sw.js; then
              echo "PUBLIC_SMOKE_PASS $SITE"
              exit 0
            fi
            echo "HomePulse not yet public; attempt $attempt/24"
            sleep 5
          done
          echo "PUBLIC_SMOKE_FAIL $SITE" >&2
          exit 1


      - name: Verify public ParkWise site
        run: |
          set -euo pipefail
          SITE="https://googgpt.github.io/Louvre/apps/parkwise/"
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error --max-time 12 "$SITE" -o /tmp/parkwise-live.html \
              && grep -q '<title>ParkWise' /tmp/parkwise-live.html \
              && curl --fail --silent --show-error --max-time 12 "${SITE}core.js" -o /tmp/parkwise-core.js \
              && grep -q 'costOfParking' /tmp/parkwise-core.js \
              && curl --fail --silent --show-error --max-time 12 "${SITE}sw.js" -o /tmp/parkwise-sw.js; then
              echo "PUBLIC_SMOKE_PASS $SITE"
              exit 0
            fi
            echo "ParkWise not yet public; attempt $attempt/24"
            sleep 5
          done
          echo "PUBLIC_SMOKE_FAIL $SITE" >&2
          exit 1

      - name: Verify public FindMyStuff website
        run: |
          set -euo pipefail
          SITE="https://googgpt.github.io/Louvre/apps/findmystuff/"
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error --max-time 12 "$SITE" -o /tmp/findmystuff-live.html \
              && grep -q '<title>FindMyStuff' /tmp/findmystuff-live.html \
              && curl --fail --silent --show-error --max-time 12 "${SITE}core.js" -o /tmp/findmystuff-core.js \
              && grep -q 'validateBackup' /tmp/findmystuff-core.js \
              && curl --fail --silent --show-error --max-time 12 "${SITE}sw.js" -o /tmp/findmystuff-sw.js; then
              echo "PUBLIC_SMOKE_PASS $SITE"
              exit 0
            fi
            echo "FindMyStuff not publicly accessible; attempt $attempt/24"
            sleep 5
          done
          echo "PUBLIC_SMOKE_FAIL $SITE" >&2
          exit 1

      - name: Verify every merged Louvre Factory public site
        run: |
          set -euo pipefail
          for slug in splitfair focusforge studyrecall trippack pricelens billcalendar habitsteps giftnest readtrail fuelmath decisiondeck eventcount roundplan worldmeet chorewheel mileagebook travelday sizematch goalladder quizcraft; do
            if [ ! -f "apps/$slug/index.html" ]; then continue; fi
            site="https://googgpt.github.io/Louvre/apps/$slug/"
            found=0
            for attempt in $(seq 1 16); do
              if curl --fail --location --silent --show-error --max-time 12 "$site" -o /tmp/louvre-factory-public.html \
                && curl --fail --silent --show-error --max-time 12 "${site}core.js" -o /tmp/louvre-factory-core.js \
                && python scripts/verify_public_app.py --slug "$slug" --html /tmp/louvre-factory-public.html --core /tmp/louvre-factory-core.js; then
                echo "PUBLIC_SMOKE_PASS $site"
                found=1
                break
              fi
              sleep 5
            done
            test "$found" -eq 1
          done

      - name: Verify published Wave 2 app pages after merging
        run: |
          set -euo pipefail
          for slug in gradepilot shiftledger colorcontrast imageshrink qrforge csvclinic textdiff citationcraft invoicecanvas roomsketch keyboardcoach laundrydecoder pollbox fileintegrity seatarrange careermatch loansim markdowndesk logiclab timelinebuilder; do
            if [ ! -f "apps/$slug/index.html" ]; then continue; fi
            site="https://googgpt.github.io/Louvre/apps/$slug/"
            live=0
            for check in $(seq 1 18); do
              if curl -fsSL --max-time 12 "$site" -o /tmp/louvre-wave2-live.html \
                 && curl -fsSL --max-time 12 "${site}core.js" -o /tmp/louvre-wave2-core.js \
                 && python scripts/verify_public_app.py --slug "$slug" --html /tmp/louvre-wave2-live.html --core /tmp/louvre-wave2-core.js; then
                echo "PUBLIC_SMOKE_PASS $site"
                live=1
                break
              fi
              sleep 5
            done
            test "$live" -eq 1
          done
