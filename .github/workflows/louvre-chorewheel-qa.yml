name: QA Louvre App XX — ChoreWheel
on:
  pull_request:
    paths:
      - 'apps/chorewheel/**'
      - '.github/workflows/louvre-chorewheel-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static security and schemas
        run: |
          node --check apps/chorewheel/core.js
          node --check apps/chorewheel/app.js
          node --check apps/chorewheel/sw.js
          node -e "JSON.parse(require('fs').readFileSync('apps/chorewheel/manifest.webmanifest','utf8'))"
      - name: Run independent business tests
        run: node --test apps/chorewheel/tests/core.test.cjs
      - name: Chromium browser integration tests
        run: |
          python -m pip install --disable-pip-version-check 'playwright>=1.45,<2'
          python apps/chorewheel/tests/browser.test.py
