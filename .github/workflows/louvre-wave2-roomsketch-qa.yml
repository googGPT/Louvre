name: Wave 2 QA — RoomSketch
on:
  pull_request:
    paths:
      - 'apps/roomsketch/**'
      - '.github/workflows/louvre-wave2-roomsketch-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source syntax, mirrored HTML, manifest and deterministic geometry
        run: |
          set -euo pipefail
          node --check apps/roomsketch/core.js
          node --check apps/roomsketch/app.js
          node --check apps/roomsketch/sw.js
          node -e "JSON.parse(require('fs').readFileSync('apps/roomsketch/manifest.webmanifest','utf8'))"
          cmp apps/roomsketch/index.html apps/roomsketch/index.htm
          node --test apps/roomsketch/tests/core.test.cjs
      - name: Install free Playwright client
        run: python -m pip install --disable-pip-version-check 'playwright>=1.45,<2'
      - name: Chromium geometry, drag, SVG/JSON export, recovery and offline mobile
        run: python apps/roomsketch/tests/browser.test.py
