name: Wave 2 QA — InvoiceCanvas
on:
  pull_request:
    paths:
      - 'apps/invoicecanvas/**'
      - '.github/workflows/louvre-wave2-invoicecanvas-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax, PWA manifest, mirrored HTML and integer-cent VAT tests
        run: |
          set -euo pipefail
          node --check apps/invoicecanvas/core.js
          node --check apps/invoicecanvas/app.js
          node --check apps/invoicecanvas/sw.js
          node -e "JSON.parse(require('fs').readFileSync('apps/invoicecanvas/manifest.webmanifest','utf8'))"
          cmp apps/invoicecanvas/index.html apps/invoicecanvas/index.htm
          node --test apps/invoicecanvas/tests/core.test.cjs
      - name: Install free browser harness
        run: python -m pip install --disable-pip-version-check 'playwright>=1.45,<2'
      - name: Chromium real print preparation, centimes, backup and mobile/offline
        run: python apps/invoicecanvas/tests/browser.test.py
