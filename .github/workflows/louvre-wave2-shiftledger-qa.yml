name: Wave 2 QA — ShiftLedger
on:
  pull_request:
    paths:
      - 'apps/shiftledger/**'
      - '.github/workflows/louvre-wave2-shiftledger-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node tests
        run: |
          node --check apps/shiftledger/core.js
          node --check apps/shiftledger/app.js
          node --check apps/shiftledger/sw.js
          node --test apps/shiftledger/tests/core.test.cjs
      - name: Install Playwright client
        run: python -m pip install --disable-pip-version-check 'playwright>=1.45,<2'
      - name: Chromium mobile test
        run: python apps/shiftledger/tests/browser.test.py
